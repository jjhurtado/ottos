spring:
  application:
    name: ottos-backend
  # Local credentials live in .env (see .env.example); real environment variables take precedence.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ottos}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

ottos:
  # The installation's time zone: due dates, late remittances and monthly reports go by its days. Required.
  timezone: ${OTTOS_TIMEZONE:}
  # Where the latest mobile build is downloaded (docs/contracts/app-version.md). {version} is replaced by its version
  # name. Empty: the version endpoint answers downloadUrl null.
  apps:
    android-download-url: ${OTTOS_ANDROID_DOWNLOAD_URL:}
    ios-download-url: ${OTTOS_IOS_DOWNLOAD_URL:}
  security:
    jwt-secret: ${OTTOS_JWT_SECRET:}
    access-token-ttl: 15m
    issuer: ottos
  admin:
    email: ${OTTOS_ADMIN_EMAIL:}
    password: ${OTTOS_ADMIN_PASSWORD:}
  # Browser origins allowed to call the API, comma-separated (e.g. https://panel.ottos.app). Empty: no CORS, as in
  # development, where the panel is served from the same origin or a proxy. The mobile app does not need CORS.
  cors:
    allowed-origins: ${OTTOS_CORS_ALLOWED_ORIGINS:}
