# Tests: in-memory H2 in PostgreSQL mode, running the same Flyway migrations.
spring:
  datasource:
    url: jdbc:h2:mem:ottos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

ottos:
  security:
    jwt-secret: VXdmYgMmpB8/jZUl3nX0+UvdDGl2+uNu/r62VT8xSHQ=
    access-token-ttl: 5m
    issuer: ottos
  admin:
    email: ""
    password: ""
